<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <div class="app">

    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="28" height="28"><circle cx="12" cy="12" r="11" fill="#1db954"/><path d="M7 10.5c3-1 7-1 10 .8M7.5 13c2.4-.7 5.6-.7 8 .6M8 15.3c2-.5 4.3-.5 6.2.5" stroke="#000" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
        <span>Melody</span>
      </div>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M21 21l-4.35-4.35M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <input type="text" id="searchInput" placeholder="Search songs or artists">
      </div>

      <div class="sidebar-card">
        <div class="section-label">Your Library</div>
        <div class="playlist-section">
          <div class="playlist-folder">
            <div class="folder-title">♥ Liked Songs</div>
            <div class="folder-count" id="likedCount">0 songs</div>
          </div>
          <div class="playlist" id="playlist"></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="main-top">
        <div class="top-left">
          <span class="status-dot" id="statusDot" title="online"></span>
          <span class="offline-note" id="offlineNote">Offline — playing from cache</span>
        </div>
        <div class="track-count-pill" id="trackCount">1 / 5</div>
      </div>

      <div class="hero-panel">
        <div class="hero-info">
          <span class="hero-label">Featured playlist</span>
          <h1 id="title">Song Title</h1>
          <p id="artist">Artist Name</p>
          <div class="hero-controls">
            <div class="hero-control-group">
              <button id="heroPrevBtn" class="hero-control-btn" title="Previous">
                <svg viewBox="0 0 24 24"><path d="M6 6v12M18 6l-9 6 9 6V6z" fill="currentColor"/></svg>
              </button>
              <button id="heroPlayBtn" class="hero-control-btn main" title="Play/Pause">
                <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 6l10 6-10 6V6z" fill="currentColor"/>
                </svg>
              </button>
              <button id="heroNextBtn" class="hero-control-btn" title="Next">
                <svg viewBox="0 0 24 24"><path d="M18 6v12M6 6l9 6-9 6V6z" fill="currentColor"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="cover-wrap">
          <canvas id="visualizer"></canvas>
          <img src="" alt="cover" class="cover" id="cover">
        </div>
      </div>

      <div class="section-grid">
        <section class="section-card">
          <div class="section-heading">
            <h3>Popular this week</h3>
            <a href="#">See all</a>
          </div>
          <div class="track-list" id="trackList"></div>
        </section>

        <section class="section-card">
          <div class="section-heading">
            <h3>Now playing</h3>
          </div>
          <div class="mini-panel">
            <div class="mini-current">
              <img src="" alt="current cover" id="heroMiniCover" class="mini-thumb">
              <div>
                <div class="mini-title" id="heroMiniTitle">Song Title</div>
                <div class="mini-artist" id="heroMiniArtist">Artist Name</div>
              </div>
            </div>
            <div class="mini-badges">
              <span class="meta-chip">Premium vibe</span>
            </div>
          </div>
        </section>
      </div>
    </main>

  </div>

  <footer class="player-bar">
    <div class="pb-left">
      <img src="" alt="" id="miniCover" class="mini-cover">
      <div class="mini-info">
        <span id="miniTitle">Song Title</span>
        <span id="miniArtist">Artist Name</span>
      </div>
    </div>

    <div class="pb-center">
      <div class="progress-section">
        <span class="time" id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-handle" id="progressHandle"></div>
        </div>
        <span class="time" id="durationTime">0:00</span>
      </div>
    </div>

    <div class="pb-right">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/></svg>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
    </div>
  </footer>

  <audio id="audio"></audio>

  <script src="script.js?v=2"></script>
</body>
</html>
